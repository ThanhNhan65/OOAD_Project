name: CI-CD Backend (.NET 10 to EC2)

on:
  push:
    branches: ["Dang", "main"]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore & Build (CI)
        run: |
          dotnet restore backend/src/OOAD.API/OOAD.API.csproj
          dotnet build backend/src/OOAD.API/OOAD.API.csproj --no-restore -c Release

      - name: Publish API
        run: dotnet publish backend/src/OOAD.API/OOAD.API.csproj -c Release -o ./publish --no-build

      - name: Copy files to EC2 (CD)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "publish/*"
          target: "/var/www/ooad-api"
          strip_components: 1

      - name: Restart Backend Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart ooad-api
            sudo systemctl is-active ooad-api
